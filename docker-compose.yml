version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: modelmesh-db
    environment:
      POSTGRES_DB: modelmesh
      POSTGRES_USER: modelmesh
      POSTGRES_PASSWORD: modelmesh123
    ports:
      - "5433:5432"  # Maps port 5433 on the host to match the dev .env configuration
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modelmesh -d modelmesh"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: modelmesh-web
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://modelmesh:modelmesh123@db:5432/modelmesh
      - UPLOAD_DIR=uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
