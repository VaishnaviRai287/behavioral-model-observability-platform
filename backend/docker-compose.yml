version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: modelmesh_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: modelmesh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: modelmesh_redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: modelmesh_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/workspace
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=ModelMesh Observability Platform
      - API_V1_STR=/api/v1
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/modelmesh
    depends_on:
      - postgres
      - redis

  celery_worker:
    build: .
    container_name: modelmesh_worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    volumes:
      - .:/workspace
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/modelmesh
    depends_on:
      - redis
      - postgres

volumes:
  pgdata:
